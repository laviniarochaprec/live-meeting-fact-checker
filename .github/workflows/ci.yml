name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-22.04  # the newest Ubuntu images no longer ship Python 3.8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the JavaScript engine tests
        run: node --test tests/engine.test.mjs
      - name: Validate the sample dictionary
        run: python validate_dictionary.py
      - name: Demo smoke test
        run: python demo.py --transcript examples/meeting.txt
